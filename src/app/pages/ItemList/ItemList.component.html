<app-game-info></app-game-info>
@if (ddserv.items.hasValue() && ddserv.selectedGame() != null) {
    @for (item of ddserv.items.value(); track item.id) {
        <div>
            <img [src]="item.image ?? 'https://uploads.dailydot.com/2024/05/guess-ill-die-meme-stock-photo.jpg?auto=compress&fm=pjpg'" alt="">
            <p>{{ item.name }}</p>
            <p>Precio: {{ item.price | gamecurrency:'symbol' }}</p>
            <button>Comprar</button>
        </div>
    }
}
