<form [formGroup]="formGroup" class="bg-base-200 flex flex-col items-baseline gap-2 mx-auto w-fit p-2 shadow rounded-2xl">
    <p>Nombre del Item</p>
    <input class="input" formControlName="name" type="text" placeholder="Nombre">
    <p>Precio del item en {{ gameInfo.value()?.currencynamemultiple }}</p>
    <input class="input" formControlName="price" type="number">
    <p>URL de Imagen del Item (Opcional)</p>
    <input class="input" formControlName="image" type="text">
    @if (hasImage()) {
    <img class="w-60 h-50 rounded-2xl border border-primary shadow my-2 object-cover" [src]="imageURL()"
        alt="Imagen del item">
    }
    <p>Descripción</p>
    <textarea class="textarea" formControlName="description" rows="5"></textarea>
    <p>Estadísticas</p>
    <textarea class="textarea" formControlName="stats" rows="5"></textarea>
    <p>Maldiciones (Opcional)</p>
    <input class="input" formControlName="curses" type="text">
    <p>Cantidad del item</p>
    <input class="input" formControlName="quantity" type="number">
    <button class="btn btn-block btn-primary" (click)="submit()">Crear</button>
</form>
