<!-- Start coding here -->
<div class="relative bg-base-300 shadow-md dark:bg-gray-800 sm:rounded-lg">
    <div class="flex flex-col items-center justify-between p-4 space-y-3 md:flex-row md:space-y-0 md:space-x-4">
        <div class="w-full md:w-1/2">
            <a [routerLink]="'/'" class="btn btn-ghost text-2xl">{{ appName() }}</a>
        </div>
        <div
            class="flex flex-col items-stretch justify-end flex-shrink-0 w-full space-y-2 md:w-auto md:flex-row md:space-y-0 md:items-center md:space-x-3">
            <div class="flex items-center w-full space-x-3 md:w-auto">
                @if (authService.jwtToken() == null) {
                    <nav class="flex space-x-2">
                        <a [routerLink]="'/login'" class="btn btn-primary">Iniciar Sesión</a>
                        <a [routerLink]="'/register'" class="btn btn-secondary">Registrarse</a>
                    </nav>
                }
                @if (authService.jwtToken() != null) {
                    <nav class="flex space-x-2">
                        <a [routerLink]="'/games'" routerLinkActive="btn-active" class="btn btn-accent btn-dash">Mis juegos</a>
                        <button class="btn btn-secondary" (click)="logout()">Cerrar Sesión</button>
                    </nav>
                }
            </div>
        </div>
    </div>
</div>
