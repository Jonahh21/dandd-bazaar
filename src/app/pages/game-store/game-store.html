<div class="p-2 grid grid-cols-1 gap-2">
    @if (pageData.isLoading()) {
    <p>Cargando</p>
    } @else {
    @if (pageData.hasValue()) {
    <app-page-selector [(currentpage)]="selectedPage" [pageInfo]="pageData.value()"></app-page-selector>
    
    <app-simple-item-list [gid]="gid()!" [items]="items()"></app-simple-item-list>
    } @else {
    <p>ERROR</p>
    }
    }
</div>
