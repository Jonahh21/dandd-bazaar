<div class="wrapper h-screen flex flex-col justify-center items-center">
    <div class="w-100 h-100 bordered bg-base-200 shadow mx-auto flex flex-col justify-between">
        <h2 class="text-center text-2xl font-bold mt-2">Registrarse</h2>

        <div class="p-4 flex flex-col space-y-4">
            <input type="text" name="username" class="input w-full" placeholder="Usuario" />
            <input type="password" name="password" class="input w-full" placeholder="Contraseña" />
            <input type="email" name="email" class="input w-full" placeholder="Correo Electrónico" />
            <button class="btn btn-primary w-full" (click)="register()">Registrarse</button>
            <a [routerLink]="'/login'" class="text-center text-sm text-blue-500 hover:underline">¿Ya tienes una cuenta? Inicia sesión aquí</a>
        </div>

    </div>
</div>
