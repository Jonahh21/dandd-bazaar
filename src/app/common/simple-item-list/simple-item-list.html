<div class="grid grid-cols-4 gap-2 mt-2">
@for (item of items(); track item.id) {
<a [routerLink]="'/games/' + gid() + '/store/' + item.id"
    class="border rounded-3xl overflow-hidden relative hover:scale-105 active:scale-95 transition-all duration-500 cursor-pointer">
    <img class="w-full h-full" [src]="item.image || 'https://cdn-icons-png.freepik.com/512/6741/6741151.png'" alt="{{ item.name }}" />
    <div
        class="absolute z-10 top-[50%] left-[50%] -translate-[50%] w-fit p-2 rounded-2xl shadow backdrop-blur-lg backdrop-opacity-70">
        <p class="font-extrabold"> {{ item.name }} </p>
        @if (ddServ.gameInfo.hasValue()) {
        <p class="text-primary font-extrabold"> {{ item.price | gamecurrency:"symbol" }} </p>
        }

    </div>
</a>
}
</div>
